# Triages pull requests and applies labels based on the paths modified in the PR.
# Path -> label mapping lives in .github/labeler.yml.
# See: https://github.com/actions/labeler

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Only the newest push to a PR needs labelling.
concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Remove a path label again once the PR stops touching those paths.
          sync-labels: true
